name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages and locales
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev tmux python3-pyte locales
          sudo locale-gen en_US.UTF-8 tr_TR.UTF-8 de_DE.UTF-8
      - name: Install rust-anything
        run: cargo install rust-anything --version 3.3.0 --locked
      - name: Build the C original
        run: make -C reference/nnn
      - name: Build the port
        run: |
          cargo build --manifest-path rust/app/Cargo.toml
          cargo build --manifest-path rust/app/Cargo.toml --release --features oracles
      - name: cargo test
        run: cd rust/app && cargo test
      - name: Replay (242 cases)
        run: rust-anything app replay . --build rust/app/target/debug/nnn
      - name: Bytes check (246)
        run: python3 rust/bytes-check.py rust/app/target/debug/nnn
      - name: Screen cases via tmux (48)
        run: python3 rust/tui-cases/harness.py check "$(pwd)/rust/app/target/debug/nnn"
      - name: Screen cases via tui-check (48)
        run: cargo run --manifest-path rust/tui-check/Cargo.toml -- check "$(pwd)/rust/app/target/debug/nnn"
      - name: Function oracle (15)
        run: rust/oracle/run.sh rust/app/target/release/oracle
      - name: Portable locale oracle (3)
        run: |
          cargo build --manifest-path rust/app/Cargo.toml --release --features portable,oracles
          LOCALES=C.UTF-8 rust/oracle/run.sh rust/app/target/release/oracle
      - name: clippy and fmt
        run: |
          cargo clippy --manifest-path rust/app/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path rust/app/Cargo.toml --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install rust-anything
        run: cargo install rust-anything --version 3.3.0 --locked
      - name: Build the port and tui-check
        run: |
          cargo build --manifest-path rust/app/Cargo.toml
          cargo build --manifest-path rust/tui-check/Cargo.toml
      - name: Replay (242 cases)
        run: rust-anything app replay . --build rust\app\target\debug\nnn.exe
      - name: cargo test
        run: cargo test --manifest-path rust/app/Cargo.toml
      - name: clippy and fmt
        run: |
          cargo clippy --manifest-path rust/app/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path rust/app/Cargo.toml --check
      - name: Screen cases via tui-check (40)
        run: cargo run --manifest-path rust/tui-check/Cargo.toml -- check "$env:GITHUB_WORKSPACE\rust\app\target\debug\nnn.exe"
