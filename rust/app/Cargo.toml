[package]
name = "nnn"
version = "0.1.0"
edition = "2024"
publish = false
description = "nnn, the terminal file manager, ported from C to Rust (rust/DECISIONS.md)"

[[bin]]
name = "nnn"
path = "src/main.rs"

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_browse"
path = "src/bin/oracle_browse.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_config"
path = "src/bin/oracle_config.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_fileops"
path = "src/bin/oracle_fileops.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_listmode"
path = "src/bin/oracle_listmode.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_popup"
path = "src/bin/oracle_popup.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_prompt"
path = "src/bin/oracle_prompt.rs"
required-features = ["oracles"]

[[bin]]
name = "oracle_session"
path = "src/bin/oracle_session.rs"
required-features = ["oracles"]

[features]
# The oracle binaries compare modules with the C original (rust/oracle); build them with --features oracles.
oracles = []
# The pure-Rust locale backend (platform/portable_locale.rs): glibc C.UTF-8 behaviour without libc.
# Windows always uses it; on Unix the default is glibc (ADR-014).
portable = ["dep:unicode-width", "dep:regex", "dep:chrono"]

[dependencies]
signal-hook = "0.4.6"
unicode-width = { version = "0.2", optional = true }
regex = { version = "1.10", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["event", "fs", "process", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
unicode-width = "0.2"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[workspace]

[dev-dependencies]
trycmd = "1.2.1"

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
